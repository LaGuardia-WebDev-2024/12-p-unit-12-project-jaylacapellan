<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>quiz about jayla🙃</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite movie?
        <select id="movie-answer">
          <option value="movie1">to all the boys ive loved before</option>
          <option value="movie2">27 dresses</option>
          <option value="movie3">how to loose a guy in 10 days</option>
          <option value="movie4">the kissing booth</option>
        </select>
      </label>
      <button type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result">
      <p id="movie-text"></p>
      <img class="movie-pic">
    </div>
    <hr />
    <!-- Book Question -->
    <form id="food-form">
      <label>
        🍽 What is my favorite food?
        <select id="food-answer">
          <option value="food1">tacos</option>
          <option value="food2">french fries</option>
          <option value="food3">anything sweet and not actual food</option>
          <option value="food4">burgers</option>
        </select>
      </label>
      <button type="submit">Check Food Answer</button>
    </form>
    <div id="food-result">
      <p id="food-text"></p>
    </div>


    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>

      
      
      //========================Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie1") {
          $("#movie-text").text("YESSSS!");
          $(".movie-pic").attr("src","https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRDiU4IPdN1zWse_2IGyZsRCNqVD5mJONkYUw&s");
        } 
        else {
          $("#movie-text").text("not quite!");
          $(".movie-pic").attr("src","https://media.tenor.com/odPjtIl41B8AAAAe/i-am-waiting.png");
        }
      });

      //=======================Food Question jQuery Code
      $("#food-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#food-answer");
        var answer = $answer.val();

        if (answer === "food3") {
          $("#food-text").text("YESSSS!");
        } 
        else {
          $("#food-text").text("whomp whomp try again!");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
